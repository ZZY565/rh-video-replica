<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>镜作｜导入 RH 网页任务结果</title><style>body{max-width:960px;margin:60px auto;padding:24px;background:#f5f0e6;color:#173832;font:16px/1.7 -apple-system,"PingFang SC",sans-serif}h1{font-size:36px;font-weight:500}textarea{box-sizing:border-box;width:100%;height:280px;padding:20px;border:1px solid #bdc7b9;border-radius:8px;font:13px monospace}button,a.action{display:inline-block;background:#173832;color:#fff4df;border:0;border-radius:4px;padding:12px 18px;font-size:15px;cursor:pointer;text-decoration:none;margin:10px 10px 10px 0}pre{white-space:pre-wrap;word-break:break-all;background:#eae3d6;padding:20px}#results a{display:block;overflow-wrap:anywhere}small{color:#6b796f}video{max-width:360px;max-height:500px;display:block}label{display:block}</style><h1>把网页任务，接回交付工程。</h1><p>在 RunningHub 结果区切到 JSON，点击复制，然后粘贴到下面。解析在本机浏览器完成，不向网络发送内容。</p><label for="raw">RunningHub 任务 JSON</label><textarea id="raw" placeholder="粘贴完整任务 JSON"></textarea><button id="parse">检查结果</button><a class="action" id="export" hidden>保存去凭据记录</a><pre id="summary">等待导入</pre><div id="results"></div><small>导出的记录只保留任务、状态、用量和媒体文件名，移除输入签名链接与认证字段。原始结果下载链接仅保留在当前页面内存中，请在有效期内下载。此工具不会发起付费任务。</small><script>
const raw=document.querySelector('#raw'),summary=document.querySelector('#summary'),results=document.querySelector('#results'),exp=document.querySelector('#export');let blobUrl;
function pickUrls(obj,path=''){let out=[];if(Array.isArray(obj))obj.forEach((v,i)=>out.push(...pickUrls(v,path+'.'+i)));else if(obj&&typeof obj==='object')for(const [k,v] of Object.entries(obj)){if(/submitParams|inputs|prompt/.test(k))continue;if(typeof v==='string'&&/^https:\/\//.test(v)&&(/url/i.test(k)||/\.(mp4|mov|webm|png|jpg)(\?|$)/i.test(v)))out.push(v);else if(typeof v==='object')out.push(...pickUrls(v,path+'.'+k));}return [...new Set(out)];}
document.querySelector('#parse').onclick=()=>{try{let j=JSON.parse(raw.value),urls=pickUrls(j),status=j.taskStatus||j.status||j.data?.status||'UNKNOWN';let record={taskId:String(j.taskId||j.data?.taskId||''),state:status,createTime:j.createTime,taskExecutedTime:j.taskExecutedTime,usage:j.usage||j.taskUsage||null,cost_fields:{consumeMoney:j.consumeMoney,consumeCoins:j.consumeCoins,thirdPartyConsumeMoney:j.thirdPartyConsumeMoney,chargedPoint:j.chargedPoint},output_files:urls.map(x=>new URL(x).pathname.split('/').pop()),parameter_summary:Object.fromEntries(Object.entries(j.submitParams||{}).filter(([k])=>['prompt','resolution','aspectRatio','duration','audio','seed','promptExtend','watermark'].includes(k))),available_fields:Object.keys(j),source:'RunningHub API Playground JSON, imported via local UI'};summary.textContent=JSON.stringify(record,null,2);results.replaceChildren();for(const [i,u] of urls.entries()){let a=document.createElement('a');a.href=u;a.textContent='打开原始结果 '+(i+1)+'（视频打开后可另存为）';a.target='_blank';a.rel='noopener';results.append(a);}if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json'}));exp.href=blobUrl;exp.download='mirrorcut-rh-task.json';exp.hidden=false;}catch(e){summary.textContent='无法解析：'+e.message;exp.hidden=true;results.replaceChildren();}};
</script></html>
